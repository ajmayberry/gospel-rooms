<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Gospel in Rooms</title>
<meta name="description" content="The life of Jesus in twenty-five isometric risograph rooms, every word from the King James Bible.">
<meta name="theme-color" content="#2b2622">
<style>
:root{--paper:#f6eedc;--ink:#243c8a;--madder:#d0483c;--ochre:#eeae32;--olive:#6c8446;--table:#2b2622;--text:#2a2f45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--table:#1e1a17}}
:root[data-theme="dark"]{--table:#1e1a17}
html,body{margin:0;height:100%;background:var(--table);overflow:hidden;overscroll-behavior:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#card{position:fixed;left:16px;bottom:16px;width:340px;max-width:calc(100vw - 32px);box-sizing:border-box;background:var(--paper);color:var(--text);
 padding:18px 20px 14px;border:1px solid rgba(36,60,138,.35);box-shadow:3px 4px 0 rgba(208,72,60,.28),0 10px 30px rgba(0,0,0,.35);
 font-family:"Iowan Old Style",Palatino,"Book Antiqua",Georgia,serif;opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s;pointer-events:none}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card.off{display:none}
#kick{font-variant:small-caps;letter-spacing:.14em;font-size:13px;color:var(--madder);text-transform:lowercase}
#ttl{font-size:26px;line-height:1.1;margin:4px 0 8px;color:var(--ink);font-weight:normal}
.rule{height:9px;margin:0 0 10px;background:linear-gradient(var(--ochre),var(--ochre)) left center/100% 1px no-repeat;position:relative}
.rule:after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);background:var(--paper);padding:0 7px;color:var(--ochre);font-size:11px}
#q{font-style:italic;font-size:16px;line-height:1.42;margin:0}
.dc{float:left;font-style:normal;font-size:44px;line-height:.9;margin:3px 6px 0 0;color:var(--madder)}
#foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
#cite{font-variant:small-caps;letter-spacing:.1em;font-size:14px;color:var(--ink)}
#nav{display:flex;gap:6px}
#nav button{font:inherit;font-size:15px;min-width:36px;height:32px;border:1px solid rgba(36,60,138,.4);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer}
#nav button:hover{background:rgba(238,174,50,.2)}
#hint{position:fixed;right:16px;top:14px;color:#e8dcc4;opacity:.75;font:13px/1.4 "Iowan Old Style",Palatino,Georgia,serif;font-style:italic;transition:opacity 1.5s;pointer-events:none;text-align:right}
@media (max-width:820px){
 #card{left:12px;right:12px;bottom:12px;width:auto;max-width:none;padding:12px 14px 10px}
 #ttl{font-size:21px;margin:2px 0 6px}#q{font-size:14.5px;line-height:1.36}.dc{font-size:36px}
 #hint{left:16px;right:16px;text-align:center;top:10px;font-size:12px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Twenty-five risograph rooms telling the life of Jesus"></canvas>
<div id="card" role="region" aria-live="polite">
 <div id="kick"></div><h1 id="ttl"></h1><div class="rule"></div>
 <p id="q"></p>
 <div id="foot"><span id="cite"></span><span id="nav"><button id="prev" aria-label="Previous room">‹</button><button id="home" aria-label="Whole sheet">▦</button><button id="next" aria-label="Next room">›</button></span></div>
</div>
<div id="hint">drag · scroll or pinch to zoom · double-tap a room · ← → · C hides the card</div>
