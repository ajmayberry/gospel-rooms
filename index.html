<!doctype html>

   1. The Annunciation           Luke 1:28
   2. The Visitation             Luke 1:42
   3. The Nativity               Luke 2:7
   4. The Shepherds              Luke 2:9
   5. The Presentation           Luke 2:35
   6. The Wise Men               Matthew 2:11
   7. The Flight into Egypt      Matthew 2:14
   8. Nazareth                   Luke 2:40
   9. The Search                 Luke 2:44

  13. The Wedding at Cana        John 2:5
  14. The Great Catch            Luke 5:10
  15. The Sermon on the Mount    Matthew 6:28
  16. The Five Thousand          John 6:9
  17. Lazarus                    John 11:43
  18. The Entry into Jerusalem   Matthew 21:9

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Gospel in Rooms</title>
<meta name="description" content="The life of Jesus in twenty-five isometric risograph rooms, every word from the King James Bible.">
<meta name="theme-color" content="#2b2622">
<style>
:root{--paper:#f6eedc;--ink:#263c88;--madder:#ee5670;--ochre:#e0a820;--olive:#129484;--table:#2b2622;--text:#2a2f45}

:root[data-theme="dark"]{--table:#1e1a17}
html,body{margin:0;height:100%;background:var(--table);overflow:hidden;overscroll-behavior:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#card{position:fixed;left:16px;bottom:16px;width:340px;max-width:calc(100vw - 32px);box-sizing:border-box;background:var(--paper);color:var(--text);
 padding:18px 20px 14px;border:1px solid rgba(36,60,138,.35);box-shadow:3px 4px 0 rgba(208,72,60,.28),0 10px 30px rgba(0,0,0,.35);
 font-family:"Iowan Old Style",Palatino,"Book Antiqua",Georgia,serif;opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s;pointer-events:none}
#card.on{opacity:1;transform:none;pointer-events:auto}

#kick{font-variant:small-caps;letter-spacing:.14em;font-size:13px;color:var(--madder);text-transform:lowercase}
#ttl{font-size:26px;line-height:1.1;margin:4px 0 8px;color:var(--ink);font-weight:normal}

<body>
<canvas id="c" aria-label="Twenty-five risograph rooms telling the life of Jesus"></canvas>
<div id="card" role="region" aria-live="polite">
 <div id="kick"></div><h1 id="ttl"></h1><div class="rule"></div>
 <p id="q"></p>
 <div id="foot"><span id="cite"></span><span id="nav"><button id="prev" aria-label="Previous room">‹</button><button id="home" aria-label="Whole sheet">▦</button><button id="next" aria-label="Next room">›</button></span></div>
</div>

<script>
'use strict';
/* ───────────── core: seeded randomness, noise field, the four inks ───────────── */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function mul32(a) {
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hsh(a, b, c) {
  let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1442695041) | 0;
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}
function strSeed(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}

// Smooth tileable value noise, 256×256, two octaves. Drives wobble, dropout and grain.
const NT = 256, NOISE = new Float32Array(NT * NT);
(() => {
  const r = mul32(90210);
  const oct = (G, w) => {
    const g = new Float32Array(G * G);
    for (let i = 0; i < G * G; i++) g[i] = r();
    const s = NT / G;
    for (let y = 0; y < NT; y++) for (let x = 0; x < NT; x++) {
      const gx = x / s, gy = y / s, ix = gx | 0, iy = gy | 0;
      const fx = smooth(gx - ix), fy = smooth(gy - iy), x1 = (ix + 1) % G, y1 = (iy + 1) % G;
      NOISE[y * NT + x] += w * lerp(lerp(g[iy * G + ix], g[iy * G + x1], fx), lerp(g[y1 * G + ix], g[y1 * G + x1], fx), fy);
    }
  };
  oct(32, .6); oct(64, .4);
})();
function noise2(x, y) {
  x -= Math.floor(x / NT) * NT; y -= Math.floor(y / NT) * NT;
  const ix = x | 0, iy = y | 0, fx = x - ix, fy = y - iy, x1 = (ix + 1) & 255, y1 = (iy + 1) & 255;
  return lerp(lerp(NOISE[iy * NT + ix], NOISE[iy * NT + x1], fx), lerp(NOISE[y1 * NT + ix], NOISE[y1 * NT + x1], fx), fy);
}

/* The four spot inks. Every colour on the sheet is one of these as a dot screen,
   or two or more of them overprinted (multiply). Paper shows through everywhere else. */
const PAPER = [246, 238, 220];
const INKS = [
  { name: 'Sunflower', rgb: [248, 200, 46],  ang: 0,  off: [.34, -.22] },
  { name: 'Teal',      rgb: [18, 148, 132],  ang: 45, off: [-.3, .2] },
  { name: 'Coral',     rgb: [238, 86, 112],  ang: 75, off: [.2, .32] },
  { name: 'Federal',   rgb: [38, 60, 136],   ang: 15, off: [-.16, -.3] },
];
const CELL = 1.45;         // halftone cell, paper units
const O = 0, G_ = 1, R_ = 2, B_ = 3;

// Colours are ink densities [sunflower, teal, coral, federal], 0..1 each.
const C = {
  none: [0, 0, 0, 0],
  undyed: [.17, 0, .05, .02],         // Jesus: plain undyed wool/linen
  undyed2: [.11, 0, .03, .02],
  linen: [.04, 0, 0, .02],
  wool: [.3, 0, .24, .08],
  brown: [.42, 0, .42, .3],
  russet: [.14, 0, .56, .1],       // Mary's veil: plain dyed wool, earth red
  rust: [.5, 0, .62, .08],
  madder: [.08, 0, .74, .03],
  olive: [.34, .62, 0, .04],
  sage: [.14, .4, 0, .06],
  ochre: [.78, 0, .05, 0],
  sand: [.4, 0, .07, 0],
  grey: [0, .04, 0, .3],
  skin: [.4, 0, .3, 0],
  skin2: [.5, 0, .38, .06],
  hair: [.3, 0, .3, .8],
  hairL: [.4, 0, .3, .45],
  grey_hair: [0, 0, 0, .28],
  stone: [.14, 0, .04, .2],
  stoneL: [.1, 0, .03, .12],
  stoneD: [.14, .04, .08, .42],
  plaster: [.16, 0, .04, .02],
  earth: [.42, 0, .32, .04],
  clay: [.3, 0, .64, .12],         // fired terracotta: reads against earth floors
  soil: [.46, 0, .44, .14],
  soilD: [.46, .04, .52, .44],
  sandG: [.44, 0, .1, 0],
  grass: [.36, .62, 0, 0],
  grassD: [.3, .76, 0, .18],
  leaf: [.2, .72, 0, .18],
  leafL: [.16, .52, 0, .06],
  wood: [.5, 0, .42, .12],
  woodD: [.5, 0, .52, .4],
  water: [0, .3, 0, .44],
  waterD: [0, .36, 0, .74],
  sky: [0, .06, 0, .16],
  skyD: [.04, 0, .1, .3],
  dusk: [.42, 0, .4, .08],
  dawn: [.42, 0, .28, 0],
  night: [0, .1, .05, .84],
  nightG: [0, .36, 0, .76],
  dark: [.08, .1, .2, .95],
  gold: [1, 0, .08, 0],
  bronze: [.7, 0, .3, .15],
  fire: [1, 0, .7, 0],
  purple: [0, 0, .74, .7],         // John 19:2 — coral over federal, a true overprint
  red: [.14, 0, .9, .05],
  steel: [0, .05, 0, .45],
  white: [0, 0, 0, 0],
};
function shade(c, k) { return [c[0] * (1 - k * .25), c[1], clamp(c[2] + k * .18, 0, 1), clamp(c[3] + k, 0, 1)]; }
function mix(a, b, t) { return a.map((v, i) => lerp(v, b[i], t)); }
function add(a, b) { return a.map((v, i) => clamp(v + b[i], 0, 1)); }

/* ───────────── raster: primitives → four density plates → halftone print ─────────────
   A drawing is a list of primitives in paper units (pu). Each one is painted into four
   density plates (alpha = ink amount), knocking out what is beneath it on every plate,
   the way a printer knocks out. The plates are then screened into dots at each ink's
   angle and misregistration and overprinted with multiply onto paper. */
const PF = 1, PL = 2, PG = 3;
const LW = .5, WOB = .55;

function fp(p, c, o) { o = o || {}; return { k: PF, p, c, lw: o.lw === undefined ? LW : o.lw, ko: o.ko, wa: o.wa, li: o.li, ld: o.ld }; }
function lp(p, w, o) { o = o || {}; return { k: PL, p, lw: w === undefined ? LW : w, li: o.li, ld: o.ld, wa: o.wa, tp: o.tp === undefined ? 1 : o.tp }; }
function gp(x, y, rx, ry, n, addD, lift, inner) { return { k: PG, x, y, rx, ry, n, add: addD, lift, inner: inner === undefined ? .15 : inner }; }

// Warp through a smooth noise field. Shared edges warp identically, so fills and
// lines stay married; a different seed gives a different "drawing" of the same thing.
function warp(x, y, amp, seed) {
  const s = seed * 41.3;
  return [x + amp * (noise2(x * .9 + s, y * .9) - .5) * 2.6, y + amp * (noise2(x * .9 + 97, y * .9 + s) - .5) * 2.6];
}
function warpPath(p, closed, amp, seed, step) {
  const out = [], n = p.length / 2, segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const x0 = p[i * 2], y0 = p[i * 2 + 1], j = (i + 1) % n, x1 = p[j * 2], y1 = p[j * 2 + 1];
    const L = Math.hypot(x1 - x0, y1 - y0), k = Math.max(1, Math.ceil(L / step));
    for (let s = 0; s < k; s++) { const t = s / k, w = warp(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, amp, seed); out.push(w[0], w[1]); }
  }
  if (!closed) { const w = warp(p[p.length - 2], p[p.length - 1], amp, seed); out.push(w[0], w[1]); }
  return out;
}
function addPoly(path, q) {
  path.moveTo(q[0], q[1]);
  for (let i = 2; i < q.length; i += 2) path.lineTo(q[i], q[i + 1]);
  path.closePath();
}
// A tapered stroke as a filled polygon, always wound the same way so overlaps stay solid.
function strokeShape(q, w, taper) {
  const n = q.length / 2; if (n < 2) return null;
  const cum = [0];
  for (let i = 1; i < n; i++) cum.push(cum[i - 1] + Math.hypot(q[i * 2] - q[i * 2 - 2], q[i * 2 + 1] - q[i * 2 - 1]));
  const tot = cum[n - 1] || 1e-6, Lf = [], Rt = [];
  for (let i = 0; i < n; i++) {
    const a = Math.max(0, i - 1), b = Math.min(n - 1, i + 1);
    let tx = q[b * 2] - q[a * 2], ty = q[b * 2 + 1] - q[a * 2 + 1];
    const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const t = cum[i] / tot;
    const ww = w * (taper ? .28 + .72 * Math.pow(Math.sin(PI * clamp(t, 0, 1)), .45) : 1) * .5;
    Lf.push(q[i * 2] - ty * ww, q[i * 2 + 1] + tx * ww);
    Rt.push(q[i * 2] + ty * ww, q[i * 2 + 1] - tx * ww);
  }
  const out = Lf;
  for (let i = Rt.length - 2; i >= 0; i -= 2) out.push(Rt[i], Rt[i + 1]);
  let area = 0;
  for (let i = 0, m = out.length / 2; i < m; i++) { const j = (i + 1) % m; area += out[i * 2] * out[j * 2 + 1] - out[j * 2] * out[i * 2 + 1]; }
  if (area < 0) { const r = []; for (let i = out.length - 2; i >= 0; i -= 2) r.push(out[i], out[i + 1]); return r; }
  return out;
}
// Outline drawn as separate hand strokes, one per edge, each with a little overshoot.
function strokePath(p, closed, w, amp, seed, taper) {
  const path = new Path2D(), n = p.length / 2, segs = closed ? n : 1;
  if (!closed) {
    const q = warpPath(p, false, amp, seed, 1.6), s = strokeShape(q, w, taper);
    if (s) addPoly(path, s);
    return path;
  }
  for (let i = 0; i < segs; i++) {
    const j = (i + 1) % n;
    let x0 = p[i * 2], y0 = p[i * 2 + 1], x1 = p[j * 2], y1 = p[j * 2 + 1];
    const L = Math.hypot(x1 - x0, y1 - y0); if (L < .05) continue;
    const ux = (x1 - x0) / L, uy = (y1 - y0) / L, h = hsh(x0 * 7 | 0, y0 * 7 | 0, seed);
    const o0 = (h - .3) * .5 * w * 1.2, o1 = (hsh(x1 * 7 | 0, y1 * 7 | 0, seed + 3) - .3) * .5 * w * 1.2;
    x0 -= ux * o0; y0 -= uy * o0; x1 += ux * o1; y1 += uy * o1;
    const q = warpPath([x0, y0, x1, y1], false, amp, seed, 1.6), s = strokeShape(q, w, taper);
    if (s) addPoly(path, s);
  }
  return path;
}
function ellPts(cx, cy, rx, ry, n, rot) {
  const o = [], cr = Math.cos(rot || 0), sr = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) { const a = i / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push(cx + x * cr - y * sr, cy + x * sr + y * cr); }
  return o;
}

// Paint primitives into plates. cx: five 2D contexts (4 inks + silhouette mask).
function paintPrims(prims, cx, seed) {
  for (const p of prims) {
    const amp = p.wa === undefined ? WOB : p.wa;
    if (p.k === PF) {
      if (p.c) {
        const path = new Path2D(); addPoly(path, warpPath(p.p, true, amp, seed, 2.2));
        for (let k = 0; k < 4; k++) {
          const g = cx[k];
          if (p.ko !== 0) { g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.fill(path); }
          if (p.c[k] > .003) { g.globalCompositeOperation = 'source-over'; g.fillStyle = 'rgba(0,0,0,' + p.c[k] + ')'; g.fill(path); }
        }
        if (p.ko !== 0) { cx[4].globalCompositeOperation = 'source-over'; cx[4].fillStyle = '#000'; cx[4].fill(path); }
      }
      if (p.lw) inkPath(cx, strokePath(p.p, true, p.lw, amp, seed, true), p.li, p.ld);
    } else if (p.k === PL) {
      inkPath(cx, strokePath(p.p, false, p.lw, amp, seed, p.tp), p.li, p.ld);
    } else if (p.k === PG) {
      for (let i = 0; i < p.n; i++) {
        const s = 1 - (1 - p.inner) * i / p.n;
        const path = new Path2D(); addPoly(path, warpPath(ellPts(p.x, p.y, p.rx * s, p.ry * s, 28), true, amp * .6, seed, 3));
        for (let k = 0; k < 4; k++) {
          const g = cx[k];
          if (p.lift && p.lift[k]) { g.globalCompositeOperation = 'destination-out'; g.fillStyle = 'rgba(0,0,0,' + p.lift[k] + ')'; g.fill(path); }
          if (p.add && p.add[k]) { g.globalCompositeOperation = 'source-over'; g.fillStyle = 'rgba(0,0,0,' + p.add[k] + ')'; g.fill(path); }
        }
      }
    }
  }
}
function inkPath(cx, path, li, ld) {
  const k = li === undefined ? B_ : li;
  const g = cx[k]; g.globalCompositeOperation = 'source-over'; g.fillStyle = 'rgba(0,0,0,' + (ld === undefined ? 1 : ld) + ')'; g.fill(path);
  cx[4].globalCompositeOperation = 'source-over'; cx[4].fillStyle = '#000'; cx[4].fill(path);
}

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Screen the plates into dots and overprint them. Runs in row slices so a big bake
// never blocks a frame for long.
const PLATE = INKS.map((ink, k) => {
  const a = ink.ang * PI / 180;
  return { c: Math.cos(a), s: Math.sin(a), kr: 1 - ink.rgb[0] / 255, kg: 1 - ink.rgb[1] / 255, kb: 1 - ink.rgb[2] / 255, off: ink.off, k };
});
const ICELL = 1 / CELL;
class Print {
  constructor(prims, bx, by, W, H, r, seed, ux, uy) {
    Object.assign(this, { prims, bx, by, W, H, r, seed, ux, uy });
    this.row = 0; this.done = false; this.planes = null;
  }
  raster() {
    const { W, H, r, bx, by } = this;
    const cvs = [0, 1, 2, 3, 4].map(() => mkCanvas(W, H));
    const cx = cvs.map(c => c.getContext('2d', { willReadFrequently: true }));
    for (const g of cx) g.setTransform(r, 0, 0, r, -bx * r, -by * r);
    paintPrims(this.prims, cx, this.seed);
    this.planes = cx.map(g => g.getImageData(0, 0, W, H).data);
    this.img = new ImageData(W, H);
    this.offs = PLATE.map(P => [Math.round(P.off[0] * r), Math.round(P.off[1] * r)]);
  }
  rows(deadline) {
    if (!this.planes) { this.raster(); if (performance.now() > deadline) return false; }
    const { W, H, r, planes, offs } = this, out = this.img.data, mask = planes[4];
    const cellPx = CELL * r, ux = this.ux + this.bx, uy = this.uy + this.by, ir = 1 / r;
    const P0 = PAPER[0], P1 = PAPER[1], P2 = PAPER[2];
    while (this.row < H) {
      const y = this.row++;
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        let R = P0, Gc = P1, B = P2, any = 0;
        for (let k = 0; k < 4; k++) {
          const sx = x - offs[k][0], sy = y - offs[k][1];
          if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
          const d0 = planes[k][(sy * W + sx) * 4 + 3];
          if (d0 < 3) continue;
          const P = PLATE[k];
          const u = ux + (sx + .5) * ir, v = uy + (sy + .5) * ir;
          const n = NOISE[((((v * .55 + k * 61) | 0) & 255) << 8) | (((u * .55 + k * 29) | 0) & 255)];
          let d = d0 / 255 * (1.08 - .2 * n);
          let cov;
          if (d > .9) {
            cov = .8 + .2 * n;
            if (hsh(x, y, k) < .022) cov *= .15;               // speckled dropout in solids
          } else {
            const a = (u * P.c + v * P.s) * ICELL, b = (v * P.c - u * P.s) * ICELL;
            const ia = Math.floor(a), ib = Math.floor(b), h = hsh(ia, ib, k + 11);
            const fa = a - ia - .5 - (h - .5) * .14, fb = b - ib - .5 - (((h * 7.31) % 1) - .5) * .14;
            const rad = Math.sqrt(d * .3183) * (.93 + h * .14);
            cov = (rad - Math.sqrt(fa * fa + fb * fb)) * cellPx + .5;
            if (cov <= 0) continue;
            if (cov > 1) cov = 1;
            if (h > .985) cov *= .3;                            // the odd starved dot
          }
          R *= 1 - cov * P.kr; Gc *= 1 - cov * P.kg; B *= 1 - cov * P.kb;
          if (cov > any) any = cov;
        }

  const acts = ['I · THE PROMISE', 'II · THE CHILD', 'III · THE CALLING', 'IV · TOWARD JERUSALEM', 'V · DEATH AND LIFE'];
  for (let b = 0; b < 5; b++) {                       // along the diamond's upper-left edge, beside each act's row
    const s = SC[b * 5], q = P(-4.9, 5, 0);
    flat(s.ox + q[0], s.oy + q[1], c30, -s30, c30, s30, () => put(acts[b], 0, 0, 15, 2, { al: 'center', ls: 4 }));
  }
  for (const s of SC) {                               // in the gaps in front of each room
    const L = P(9.4, SLAB + 2.3, 0), R = P(SLAB + 2.3, 9.4, 0);
    flat(s.ox + L[0], s.oy + L[1], c30, s30, -c30, s30, () => { put(s.def.title, 0, 0, 17, 3, { al: 'right', it: true }); put(ROMAN[s.i] + '   ', -g.measureText(s.def.title).width, 0, 13, 2, { al: 'right', ls: 1.5 }); });
    flat(s.ox + R[0], s.oy + R[1], c30, -s30, c30, s30, () => put(s.def.cite, 0, 0, 12, 1, { ls: .6, a: .8 }));
  }
  put(INKS.map(k => k.name.toUpperCase() + ' ' + k.ang + '°').join('   '), SW.ox, SW.oy - 12, 10, 3, { ls: 2, a: .75 });
  put('Four spot inks, halftone, overprinted. Canvas only, one file.', MX, SHH - MB + 62, 12, 3, { it: true, a: .75 });
  g.restore();
}

/* ── camera ── */
const cam = { x: SHW / 2, y: SHH / 2, z: .3 };
const fitZ = () => Math.min(W / (SHW + 40), H / (SHH + 40));
const cardEl = document.getElementById('card');
function closeView(i) {
  const c = SC[i].cell, wide = W > 1100;
  const cw = wide ? 380 : 0, chh = wide ? 0 : Math.min(cardEl.offsetHeight || 190, H * .45);
  const z = Math.min((W - cw - 30) / (CW + 10), (H - chh - 30) / (CHT + 10)) * .97;
  return { x: c[0] + CW / 2 - cw / 2 / z, y: c[1] + CHT / 2 + chh / 2 / z - 4 / z, z };
}
const fitView = () => ({ x: SHW / 2, y: SHH / 2, z: fitZ() });
let fly = null;
function flyTo(v, dur, onEnd) {
  const d = Math.hypot(v.x - cam.x, v.y - cam.y) * Math.min(cam.z, v.z);
  fly = { a: { x: cam.x, y: cam.y, z: cam.z }, b: v, t0: now, dur: dur || 2.2, dip: clamp(d / 900, 0, .45), onEnd };
}
function stepFly() {
  if (!fly) return;
  const u = clamp((now - fly.t0) / fly.dur, 0, 1), e = ease(u);
  cam.x = lerp(fly.a.x, fly.b.x, e); cam.y = lerp(fly.a.y, fly.b.y, e);
  cam.z = Math.exp(lerp(Math.log(fly.a.z), Math.log(fly.b.z), e)) * (1 - fly.dip * Math.sin(PI * u));
  if (u >= 1) { const cb = fly.onEnd; fly = null; if (cb) cb(); }
}
const toWorld = (sx, sy) => [(sx - W / 2) / cam.z + cam.x, (sy - H / 2) / cam.z + cam.y];
const centre = s => [s.ox, s.oy + 64];
function sceneAt(wx, wy) { for (const s of SC) { const c = centre(s); if (Math.hypot(wx - c[0], (wy - c[1]) * 1.3) < 175) return s.i; } return -1; }
function nearestScene() {
  let best = 0, bd = 1e9;
  for (const s of SC) { const c = centre(s), d = Math.hypot(c[0] - cam.x, c[1] - cam.y); if (d < bd) { bd = d; best = s.i; } }
  return best;
}
function clampCam() {
  cam.z = clamp(cam.z, fitZ() * .6, 9);
  cam.x = clamp(cam.x, -100, SHW + 100); cam.y = clamp(cam.y, -100, SHH + 100);
}

/* ── the tour ── */
const tour = { on: !Q.notour, i: -1, phase: 'print', t0: 0 };
let lastInput = -99, now = 0;
const HOLD = 10;
function startScene(i) { SC[i].clock0 = now; }
function tourNext() {
  tour.i++;
  if (tour.i >= SC.length) { tour.phase = 'overview'; tour.t0 = now; flyTo(fitView(), 2.6); tour.i = -1; return; }
  tour.phase = 'fly'; startScene(tour.i);
  flyTo(closeView(tour.i), tour.i === 0 && cam.z < fitZ() * 1.5 ? 2.6 : 2.2, () => { tour.phase = 'hold'; tour.t0 = now; });
}
function stepTour() {
  if (!tour.on) { if (!Q.notour && now - lastInput > 20 && !drag && !fly) { tour.on = true; tour.i = nearestScene() - (cam.z > fitZ() * 2 ? 0 : 1); tour.i = Math.max(-1, tour.i - 1); tourNext(); } return; }
  if (tour.phase === 'print') { if (now - tour.t0 > (Q.instant ? .5 : 4.2) && SC.every(s => s.rev !== null)) tourNext(); }
  else if (tour.phase === 'hold') { if (now - tour.t0 > HOLD) tourNext(); }
  else if (tour.phase === 'overview') { if (!fly && now - tour.t0 > 8) tourNext(); }
}
function interrupt() { lastInput = now; if (tour.on) { tour.on = false; } fly = null; }

/* ── input ── */
const ptrs = new Map(); let drag = null, vel = [0, 0], lastTap = { t: -9, x: 0, y: 0 };
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); interrupt();
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: now, moved: 0 };
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; drag = { pinch: Math.hypot(a[0] - b[0], a[1] - b[1]), z: cam.z, mid: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], moved: 99 }; }
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]); lastInput = now;
  if (!drag) return;
  if (drag.pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const w = toWorld(drag.mid[0], drag.mid[1]);
    cam.z = clamp(drag.z * d / drag.pinch, fitZ() * .6, 9);
    cam.x = w[0] - (mid[0] - W / 2) / cam.z; cam.y = w[1] - (mid[1] - H / 2) / cam.z; drag.mid = mid;
  } else if (!drag.pinch) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    cam.x -= dx / cam.z; cam.y -= dy / cam.z; drag.moved += Math.abs(dx) + Math.abs(dy);
    vel = [dx / cam.z * 60, dy / cam.z * 60].map(v => v * .5 + 0); drag.x = e.clientX; drag.y = e.clientY;
  }
  clampCam();
});
const up = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (drag && !drag.pinch && drag.moved < 8) {
    if (now - lastTap.t < .32 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) { dbl(e.clientX, e.clientY); lastTap.t = -9; }
    else lastTap = { t: now, x: e.clientX, y: e.clientY };
    vel = [0, 0];
  }
  if (ptrs.size === 0) drag = null;
  else if (ptrs.size === 1) { const [p] = [...ptrs.values()]; drag = { x: p[0], y: p[1], moved: 99 }; }
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
function dbl(sx, sy) {
  const w = toWorld(sx, sy), i = sceneAt(w[0], w[1]);
  if (i < 0) { flyTo(fitView(), 1.4); return; }
  const v = closeView(i);
  if (cam.z > v.z * .8 && nearestScene() === i) flyTo(fitView(), 1.6);
  else { startScene(i); flyTo(v, 1.5); }
}
cv.addEventListener('wheel', e => {
  e.preventDefault(); interrupt();
  const w = toWorld(e.clientX, e.clientY), k = Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018));
  cam.z = clamp(cam.z * k, fitZ() * .6, 9);
  cam.x = w[0] - (e.clientX - W / 2) / cam.z; cam.y = w[1] - (e.clientY - H / 2) / cam.z; clampCam();
}, { passive: false });
function goScene(i) { i = (i + 25) % 25; interrupt(); startScene(i); flyTo(closeView(i), 1.3); }
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowRight') goScene(nearestScene() + 1);
  else if (k === 'ArrowLeft') goScene(nearestScene() - 1);
  else if (k === 'ArrowDown') goScene(nearestScene() + 5);
  else if (k === 'ArrowUp') goScene(nearestScene() - 5);
  else if (k === '+' || k === '=') { interrupt(); flyTo({ x: cam.x, y: cam.y, z: Math.min(9, cam.z * 1.5) }, .35); }
  else if (k === '-' || k === '_') { interrupt(); flyTo({ x: cam.x, y: cam.y, z: Math.max(fitZ() * .6, cam.z / 1.5) }, .35); }
  else if (k === '0') { interrupt(); flyTo(fitView(), 1.2); }
  else if (k === 'c' || k === 'C') { cardHidden = !cardHidden; cardEl.classList.toggle('off', cardHidden); }
  else if (k === ' ') { e.preventDefault(); if (tour.on) interrupt(); else { lastInput = -99; } }
  else return;
});
cv.addEventListener('dblclick', e => e.preventDefault());

/* ── the chapter card ── */
let cardHidden = false, cardFor = -2;
const $ = id => document.getElementById(id);
const curly = s => s.replace(/(^|[\s(])'/g, '$1‘').replace(/'/g, '’').replace(/(^|[\s(])"/g, '$1“').replace(/"/g, '”');
function setCard(i) {
  if (i === cardFor) return; cardFor = i;
  if (i < 0) { cardEl.classList.remove('on'); return; }
  const d = SC[i].def, q = curly(d.quote);
  $('kick').textContent = d.act + ' · Chapter ' + ROMAN[i];
  $('ttl').textContent = d.title;
  $('q').innerHTML = '<span class="dc">' + q[0] + '</span>' + q.slice(1).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  $('cite').textContent = d.cite;
  cardEl.classList.add('on');
}
$('prev').onclick = () => goScene(nearestScene() - 1);
$('next').onclick = () => goScene(nearestScene() + 1);
$('home').onclick = () => { interrupt(); flyTo(fitView(), 1.3); };

/* ── the frame ── */
let lastT = performance.now(), fps = 60;
function frame(ms) {
  const dt = Math.min(.1, (ms - lastT) / 1000); lastT = ms; now = ms / 1000; fps = lerp(fps, 1 / Math.max(dt, .001), .05);
  stepTour(); stepFly();
  if (!drag && !fly && (Math.abs(vel[0]) + Math.abs(vel[1]) > .5)) { cam.x -= vel[0] * dt; cam.y -= vel[1] * dt; vel = vel.map(v => v * Math.pow(.02, dt)); clampCam(); }
  if (drag) vel = vel.map(v => v * .8);

  const need = cam.z * DPR; let lv = 0; while (lv < LV.length - 1 && need > LV[lv] * 1.05) lv++;
  const w0 = toWorld(0, 0), w1 = toWorld(W, H), visible = new Set();
  for (const s of SC) { const c = s.cell; if (c[0] < w1[0] + 40 && c[0] + c[2] > w0[0] - 40 && c[1] - 60 < w1[1] && c[1] + c[3] > w0[1]) visible.add(s.i); }
  const next = tour.on && tour.i + 1 < SC.length ? tour.i + 1 : -1;
  press(performance.now() + (PHONE ? 7 : 9), visible, lv, next);

  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#2b2622'; g.fillRect(0, 0, cv.width, cv.height);
  const Z = cam.z * DPR;
  g.setTransform(Z, 0, 0, Z, (W / 2 - cam.x * cam.z) * DPR, (H / 2 - cam.y * cam.z) * DPR);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.save(); g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 30 * Z; g.shadowOffsetY = 8 * Z;
  g.fillStyle = 'rgb(' + PAPER.join(',') + ')'; g.fillRect(0, 0, SHW, SHH); g.restore();
  titles(); marks();
  const sw = bestPrint('sw', 0, 0, Math.min(lv, 1)); if (sw) drawPrint(sw, [SW.ox, SW.oy]);

  const boil = Math.floor(now * 3) % 3;
  sprMs = 0;
  const order = [...visible].sort((a, b) => SC[a].ga + SC[a].gb - SC[b].ga - SC[b].gb || a - b);
  for (const i of order) {
    const sc = SC[i];
    if (sc.rev === null) continue;
    const pin = clamp((now - sc.rev) / .9, 0, 1);
    const bg = bestPrint(i, 0, boil, lv); if (!bg) continue;
    g.save();
    if (pin < 1) { const c = sc.cell; g.beginPath(); g.rect(c[0] - 40, c[1] - 200, c[2] + 80, (c[3] + 200) * smooth(pin)); g.clip(); }
    drawPrint(bg, [sc.ox, sc.oy]);
    sc.fa = smooth(clamp((now - sc.rev - .7) / .6, 0, 1));
    if (sc.fa > 0) {
      const t = now - sc.clock0 + Q.t, sts = [];
      for (const f of sc.figs) { const st = figState(f, t); if (st && st.a > .01) sts.push(st); }
      sts.sort((a, b) => (a.x + a.y + (a.f.dep || a.dep || 0)) - (b.x + b.y + (b.f.dep || b.dep || 0)));
      for (const st of sts) drawFig(st, sc, lv, boil, sc.def.tint);
    }
    const fgp = sc.layers[1] && bestPrint(i, 1, boil, lv); if (fgp) drawPrint(fgp, [sc.ox, sc.oy]);
    g.restore();
  }
  // paper grain over everything printed
  if (!grainPat) grainPat = g.createPattern(GRAIN, 'repeat');
  if (grainPat.setTransform) grainPat.setTransform(new DOMMatrix().scale(.6));
  g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = .55; g.fillStyle = grainPat; g.fillRect(Math.max(0, w0[0]), Math.max(0, w0[1]), Math.min(SHW, w1[0]) - Math.max(0, w0[0]), Math.min(SHH, w1[1]) - Math.max(0, w0[1])); g.restore();

  const cl = SC.length ? closeView(nearestScene()).z : 1;
  setCard(!cardHidden && cam.z > cl * .6 ? nearestScene() : -1);
  if (Q.debug) { g.setTransform(DPR, 0, 0, DPR, 0, 0); g.fillStyle = '#fff'; g.font = '12px monospace'; g.fillText(fps.toFixed(0) + ' fps  z ' + cam.z.toFixed(2) + '  lv ' + lv + '  bake ' + (bkBytes / 1048576 | 0) + 'MB  spr ' + (sprBytes / 1048576 | 0) + 'MB ' + SPR.size, 10, H - 10); }
  requestAnimationFrame(frame);
}

/* ── start ── */
now = performance.now() / 1000;
{ const f = fitView(); cam.x = f.x; cam.y = f.y; cam.z = f.z; }
tour.t0 = now;
if (Q.scene >= 1 && Q.scene <= 25) {
  const i = Q.scene - 1, v = closeView(i); cam.x = v.x; cam.y = v.y; cam.z = v.z; startScene(i);
  if (tour.on) { tour.phase = 'hold'; tour.i = i; tour.t0 = now; }
}
requestAnimationFrame(frame);

</script>
<script>setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity=0},7000)</script>
</body>
